<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Datenschutz – 1+1=3</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #e8527a;
      --blue: #4fc3f7;
      --bg: #1a1f2e;
      --bg-nav: rgba(16, 20, 32, 0.97);
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.65);
      --text-faint: rgba(255,255,255,0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background: var(--bg-nav);
      border-bottom: 0.5px solid rgba(255,255,255,0.07);
    }

    .nav-logo a { color: #fff; text-decoration: none; }

    .lang-switcher { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
    .lang-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: rgba(232,82,122,0.18);
      border-color: rgba(232,82,122,0.5);
      color: #fff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    /* Diese Styles greifen jetzt automatisch auf den eingefügten Text zu */
    #privacy-content h1 { font-size: 2rem; font-weight: 800; margin-bottom: 2rem; letter-spacing: -0.5px; }
    #privacy-content h2 { font-size: 1.25rem; font-weight: 700; margin-top: 2.5rem; margin-bottom: 1rem; color: #fff; }
    #privacy-content h3 { font-size: 1rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: rgba(255,255,255,0.9); }
    #privacy-content p, #privacy-content li { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 1rem; }
    #privacy-content .upper { text-transform: uppercase; font-size: 0.88rem; letter-spacing: 0.5px; }
    
    a { color: var(--pink); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.9rem;
    }
    .back-link:hover { color: var(--pink); }

    footer {
      border-top: 0.5px solid rgba(255,255,255,0.08);
      padding: 2rem;
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      nav { padding: 1rem 1.25rem; }
      main { padding: 2rem 1.25rem 4rem; }
      #privacy-content h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <a href="index.html"><img src="logo%20(2).png" alt="1+1=3" style="height: 36px; width: auto;" /></a>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-de" onclick="setLang('de')">DE</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" id="btn-it" onclick="setLang('it')">IT</button>
    <button class="lang-btn" id="btn-pt-PT" onclick="setLang('pt-PT')">PT</button>
    <button class="lang-btn" id="btn-pt-BR" onclick="setLang('pt-BR')">BR</button>
  </div>
</nav>

<main>
  <a href="index.html" class="back-link" id="back-link">← Zurück zur Startseite</a>

  <div id="privacy-content"></div>
</main>

<footer>
  Chada Kids &middot; chada-kids.de
</footer>

<script src="privacy-de.js"></script>
<script src="privacy-en.js"></script>
<script src="privacy-es.js"></script>
<script src="privacy-fr.js"></script>
<script src="privacy-it.js"></script>
<script src="privacy-pt-PT.js"></script>
<script src="privacy-pt-BR.js"></script>

<script>
const T_PRIVACY = {
  de: typeof PRIVACY_DE !== 'undefined' ? PRIVACY_DE : window.PRIVACY_DE,
  en: typeof PRIVACY_EN !== 'undefined' ? PRIVACY_EN : window.PRIVACY_EN,
  es: typeof PRIVACY_ES !== 'undefined' ? PRIVACY_ES : window.PRIVACY_ES,
  fr: typeof PRIVACY_FR !== 'undefined' ? PRIVACY_FR : window.PRIVACY_FR,
  it: typeof PRIVACY_IT !== 'undefined' ? PRIVACY_IT : window.PRIVACY_IT,
  'pt-PT': typeof PRIVACY_PT_PT !== 'undefined' ? PRIVACY_PT_PT : window.PRIVACY_PT_PT,
  'pt-BR': typeof PRIVACY_PT_BR !== 'undefined' ? PRIVACY_PT_BR : window.PRIVACY_PT_BR
};

function setLang(lang) {
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;

  // Lädt den passenden Text in die leere Box
  const contentBox = document.getElementById('privacy-content');
  if (T_PRIVACY[lang]) {
    contentBox.innerHTML = T_PRIVACY[lang];
  } else {
    contentBox.innerHTML = "<p>Translation coming soon / Übersetzung folgt.</p>";
  }

  // Übersetzungen für den "Zurück"-Button und Seitentitel
  const backTexts = { 
    de: '← Zurück zur Startseite', 
    en: '← Back to homepage', 
    es: '← Volver al inicio',
    fr: '← Retour à l\'accueil',
    it: '← Torna alla home',
    'pt-PT': '← Voltar ao início',
    'pt-BR': '← Voltar ao início'
  };
  const titles = { 
    de: 'Datenschutz – 1+1=3', 
    en: 'Privacy Policy – 1+1=3', 
    es: 'Privacidad – 1+1=3',
    fr: 'Confidentialité – 1+1=3',
    it: 'Privacy – 1+1=3',
    'pt-PT': 'Privacidade – 1+1=3',
    'pt-BR': 'Privacidade – 1+1=3'
  };

  const backLink = document.getElementById('back-link');
  if(backLink) {
    backLink.textContent = backTexts[lang];
    backLink.href = 'index.html?lang=' + lang; // Hält die Sprache aufrecht, wenn man zurückgeht
  }
  
  document.title = titles[lang];

  // Aktiven Button markieren
  ['de','en','es','fr','it','pt-PT','pt-BR'].forEach(l => {
    const btn = document.getElementById('btn-' + l);
    if(btn) btn.classList.toggle('active', l === lang);
  });
}

// Sprache beim Laden anwenden
const urlParams = new URLSearchParams(window.location.search);
const urlLang = urlParams.get('lang');
const savedLang = urlLang || localStorage.getItem('lang') || 'de';

// Kleiner Timeout, damit die Skripte sicher geladen sind
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => setLang(savedLang), 50);
});
</script>

</body>
</html>
