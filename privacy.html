<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website-Datenschutz – 1+1=3</title>
  <link rel="stylesheet" href="assets/legal.css" />
</head>
<body>

<nav class="legal-nav">
  <div class="nav-logo">
    <a href="index.html" id="home-logo-link"><img src="assets/logo.png" width="168" height="88" alt="1+1=3" /></a>
  </div>
  <div class="lang-dropdown" id="lang-dropdown">
    <button type="button" id="language-toggle" class="lang-dropdown-btn" onclick="toggleLangDropdown()" aria-label="Sprache wählen" aria-expanded="false" aria-controls="language-options">
      <span id="dd-flag-wrap"></span>
      <span id="dd-label-current">DE</span>
      <svg class="lang-dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="lang-dropdown-menu" id="language-options">
      <button type="button" class="lang-option" id="opt-de" onclick="pickLang('de')">DE</button>
      <button type="button" class="lang-option" id="opt-en" onclick="pickLang('en')">EN</button>
      <button type="button" class="lang-option" id="opt-es" onclick="pickLang('es')">ES</button>
      <button type="button" class="lang-option" id="opt-fr" onclick="pickLang('fr')">FR</button>
      <button type="button" class="lang-option" id="opt-it" onclick="pickLang('it')">IT</button>
      <button type="button" class="lang-option" id="opt-pt-PT" onclick="pickLang('pt-PT')">PT</button>
      <button type="button" class="lang-option" id="opt-pt-BR" onclick="pickLang('pt-BR')">BR</button>
    </div>
  </div>
</nav>

<main>
  <a href="index.html" class="back-link" id="back-link">← Zurück zur Startseite</a>
  <div id="privacy-content" class="legal-content"></div>
</main>

<footer class="legal-footer">
  <div class="legal-footer-inner">
    <p class="footer-brand">Chada Kids &middot; 1+1=3</p>
    <div class="footer-links">
      <a id="footer-privacy" href="privacy.html?lang=de">Website-Datenschutz</a>
      <a id="footer-app-privacy" href="app-privacy.html?lang=de">App-Datenschutz</a>
      <a id="footer-imprint" href="imprint.html?lang=de">Impressum</a>
    </div>
  </div>
</footer>

<script src="privacy-de.js"></script>
<script src="privacy-en.js"></script>
<script src="privacy-es.js"></script>
<script src="privacy-fr.js"></script>
<script src="privacy-it.js"></script>
<script src="privacy-pt-PT.js"></script>
<script src="privacy-pt-BR.js"></script>

<script>
const T_PRIVACY = {
  de: typeof PRIVACY_DE !== 'undefined' ? PRIVACY_DE : window.PRIVACY_DE,
  en: typeof PRIVACY_EN !== 'undefined' ? PRIVACY_EN : window.PRIVACY_EN,
  es: typeof PRIVACY_ES !== 'undefined' ? PRIVACY_ES : window.PRIVACY_ES,
  fr: typeof PRIVACY_FR !== 'undefined' ? PRIVACY_FR : window.PRIVACY_FR,
  it: typeof PRIVACY_IT !== 'undefined' ? PRIVACY_IT : window.PRIVACY_IT,
  'pt-PT': typeof PRIVACY_PT_PT !== 'undefined' ? PRIVACY_PT_PT : window.PRIVACY_PT_PT,
  'pt-BR': typeof PRIVACY_PT_BR !== 'undefined' ? PRIVACY_PT_BR : window.PRIVACY_PT_BR
};

const FLAGS = {
  'de': `<svg class="lang-flag" viewBox="0 0 5 3"><rect width="5" height="1" fill="#000"/><rect y="1" width="5" height="1" fill="#DD0000"/><rect y="2" width="5" height="1" fill="#FFCE00"/></svg>`,
  'en': `<svg class="lang-flag" viewBox="0 0 60 30"><path d="M0,0v30h60v-30z" fill="#012169"/><path d="M0,0 60,30M60,0 0,30" stroke="#fff" stroke-width="6"/><path d="M30,0v30M0,15h60" stroke="#fff" stroke-width="10"/><path d="M30,0v30M0,15h60" stroke="#C8102E" stroke-width="6"/></svg>`,
  'es': `<svg class="lang-flag" viewBox="0 0 4 3"><rect width="4" height="3" fill="#AA151B"/><rect y="0.75" width="4" height="1.5" fill="#F1BF00"/></svg>`,
  'fr': `<svg class="lang-flag" viewBox="0 0 3 2"><rect width="1" height="2" fill="#002395"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ED2939"/></svg>`,
  'it': `<svg class="lang-flag" viewBox="0 0 3 2"><rect width="1" height="2" fill="#009246"/><rect x="1" width="1" height="2" fill="#fff"/><rect x="2" width="1" height="2" fill="#ce2b37"/></svg>`,
  'pt-PT': `<svg class="lang-flag" viewBox="0 0 3 2"><rect width="1.2" height="2" fill="#006600"/><rect x="1.2" width="1.8" height="2" fill="#FF0000"/><circle cx="1.2" cy="1" r="0.3" fill="#FFFF00"/></svg>`,
  'pt-BR': `<svg class="lang-flag" viewBox="0 0 7 5"><rect width="7" height="5" fill="#009C3B"/><path d="M3.5 0.5L6.5 2.5L3.5 4.5L0.5 2.5z" fill="#FFDF00"/><circle cx="3.5" cy="2.5" r="1" fill="#002776"/></svg>`
};
const LABELS = { 'de': 'DE', 'en': 'EN', 'es': 'ES', 'fr': 'FR', 'it': 'IT', 'pt-PT': 'PT', 'pt-BR': 'BR' };


const LANGUAGE_NAMES = { de: 'Deutsch', en: 'English', es: 'Español', fr: 'Français', it: 'Italiano', 'pt-PT': 'Português (Portugal)', 'pt-BR': 'Português (Brasil)' };
const LANGUAGE_PROMPTS = { de: 'Sprache wählen', en: 'Choose language', es: 'Elegir idioma', fr: 'Choisir la langue', it: 'Scegli la lingua', 'pt-PT': 'Escolher idioma', 'pt-BR': 'Escolher idioma' };
const FOOTER_LABELS = {"de": ["Website-Datenschutz", "App-Datenschutz", "Impressum"], "en": ["Website Privacy", "App Privacy", "Imprint"], "es": ["Privacidad del sitio", "Privacidad de App", "Aviso Legal"], "fr": ["Confidentialité Site", "Confidentialité App", "Mentions légales"], "it": ["Privacy Sito", "Privacy App", "Note legali"], "pt-PT": ["Privacidade Site", "Privacidade App", "Aviso legal"], "pt-BR": ["Privacidade do Site", "Privacidade do App", "Aviso Legal"]};
function readStoredLanguage() { try { return localStorage.getItem('lang'); } catch { return null; } }
function closeLangDropdown() {
  document.getElementById('lang-dropdown').classList.remove('open');
  document.getElementById('language-toggle').setAttribute('aria-expanded', 'false');
}
function updateLegalShell(lang) {
  const pages = ['privacy.html', 'app-privacy.html', 'imprint.html'];
  ['footer-privacy', 'footer-app-privacy', 'footer-imprint'].forEach((id, index) => {
    const link = document.getElementById(id);
    link.textContent = FOOTER_LABELS[lang][index];
    link.href = pages[index] + '?lang=' + lang;
    if (pages[index] === 'privacy.html') link.setAttribute('aria-current', 'page');
    else link.removeAttribute('aria-current');
  });
  document.getElementById('home-logo-link').href = 'index.html?lang=' + lang;
  document.getElementById('language-toggle').setAttribute('aria-label', LANGUAGE_PROMPTS[lang]);
  document.title = FOOTER_LABELS[lang][pages.indexOf('privacy.html')] + ' – 1+1=3';
}

function toggleLangDropdown() { const open = document.getElementById('lang-dropdown').classList.toggle('open'); document.getElementById('language-toggle').setAttribute('aria-expanded', String(open)); }
function pickLang(lang) { closeLangDropdown(); setLang(lang); document.getElementById('language-toggle').focus(); }

function setLang(lang) {
  lang = Object.hasOwn(LANGUAGE_NAMES, lang) ? lang : 'de';
  try { localStorage.setItem('lang', lang); } catch {}
  updateLegalShell(lang);
  const currentUrl = new URL(window.location.href);
  if (currentUrl.searchParams.get('lang') !== lang) {
    currentUrl.searchParams.set('lang', lang);
    window.history.replaceState(window.history.state, '', currentUrl);
  }
  document.documentElement.lang = lang;
  document.getElementById('dd-flag-wrap').innerHTML = FLAGS[lang];
  document.getElementById('dd-label-current').textContent = LABELS[lang];
  
  const contentBox = document.getElementById('privacy-content');
  if (T_PRIVACY[lang]) {
    contentBox.innerHTML = T_PRIVACY[lang];
  } else {
    contentBox.innerHTML = "<p>Translation coming soon / Übersetzung folgt.</p>";
  }
  
  const backTexts = { de: '← Zurück zur Startseite', en: '← Back to homepage', es: '← Volver al inicio', fr: '← Retour à l\'accueil', it: '← Torna alla home', 'pt-PT': '← Voltar ao início', 'pt-BR': '← Voltar ao início' };
  const backLink = document.getElementById('back-link');
  if(backLink) { backLink.textContent = backTexts[lang]; backLink.href = 'index.html?lang=' + lang; }
  
  ['de','en','es','fr','it','pt-PT','pt-BR'].forEach(l => {
    const el = document.getElementById('opt-' + l);
    if (el) { el.classList.toggle('active', l === lang); el.innerHTML = FLAGS[l] + ' ' + LANGUAGE_NAMES[l]; }
  });
}

document.addEventListener('click', e => { if (!document.getElementById('lang-dropdown').contains(e.target)) closeLangDropdown(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('lang-dropdown').classList.contains('open')) { closeLangDropdown(); document.getElementById('language-toggle').focus(); } });

const urlParams = new URLSearchParams(window.location.search);
window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => setLang(urlParams.get('lang') || readStoredLanguage() || 'de'), 50);
});
</script>

</body>
</html>
