<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impressum – 1+1=3</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #e8527a;
      --blue: #4fc3f7;
      --bg: #1a1f2e;
      --bg-nav: rgba(16, 20, 32, 0.97);
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.65);
      --text-faint: rgba(255,255,255,0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background: var(--bg-nav);
      border-bottom: 0.5px solid rgba(255,255,255,0.07);
    }

    .nav-logo a { color: #fff; text-decoration: none; }

    .lang-switcher { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
    .lang-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: rgba(232,82,122,0.18);
      border-color: rgba(232,82,122,0.5);
      color: #fff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    #content h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }

    #content h2 {
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      color: var(--pink);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #content p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    #content .section {
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 1rem;
    }
    #content .section:last-of-type { border-bottom: none; }

    #content a { color: var(--pink); text-decoration: none; }
    #content a:hover { text-decoration: underline; }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.9rem;
    }
    .back-link:hover { color: var(--pink); }

    #content .source {
      margin-top: 2rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
    }

    footer {
      border-top: 0.5px solid rgba(255,255,255,0.08);
      padding: 2rem;
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      nav { padding: 1rem 1.25rem; }
      main { padding: 2rem 1.25rem 4rem; }
      #content h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <a href="index.html"><img src="logo%20(2).png" alt="1+1=3" style="height: 36px; width: auto;" /></a>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-de" onclick="setLang('de')">DE</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
    <button class="lang-btn" id="btn-fr" onclick="setLang('fr')">FR</button>
    <button class="lang-btn" id="btn-it" onclick="setLang('it')">IT</button>
    <button class="lang-btn" id="btn-pt-PT" onclick="setLang('pt-PT')">PT</button>
    <button class="lang-btn" id="btn-pt-BR" onclick="setLang('pt-BR')">BR</button>
  </div>
</nav>

<main>
  <a href="index.html" class="back-link" id="back-link">← Zurück zur Startseite</a>
  <div id="content"></div>
</main>

<footer>
  Chada Kids &middot; chada-kids.de
</footer>

<script src="imprint-de.js"></script>
<script src="imprint-en.js"></script>
<script src="imprint-es.js"></script>
<script src="imprint-fr.js"></script>
<script src="imprint-it.js"></script>
<script src="imprint-pt-PT.js"></script>
<script src="imprint-pt-BR.js"></script>

<script>
const T_IMPRINT = {
  de: typeof IMPRINT_DE !== 'undefined' ? IMPRINT_DE : window.IMPRINT_DE,
  en: typeof IMPRINT_EN !== 'undefined' ? IMPRINT_EN : window.IMPRINT_EN,
  es: typeof IMPRINT_ES !== 'undefined' ? IMPRINT_ES : window.IMPRINT_ES,
  fr: typeof IMPRINT_FR !== 'undefined' ? IMPRINT_FR : window.IMPRINT_FR,
  it: typeof IMPRINT_IT !== 'undefined' ? IMPRINT_IT : window.IMPRINT_IT,
  'pt-PT': typeof IMPRINT_PT_PT !== 'undefined' ? IMPRINT_PT_PT : window.IMPRINT_PT_PT,
  'pt-BR': typeof IMPRINT_PT_BR !== 'undefined' ? IMPRINT_PT_BR : window.IMPRINT_PT_BR
};

function setLang(lang) {
  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;

  const contentBox = document.getElementById('content');
  if (T_IMPRINT[lang]) {
    contentBox.innerHTML = T_IMPRINT[lang];
  } else {
    contentBox.innerHTML = "<p>Translation coming soon / Übersetzung folgt.</p>";
  }

  const backTexts = { 
    de: '← Zurück zur Startseite', 
    en: '← Back to homepage', 
    es: '← Volver al inicio',
    fr: '← Retour à l\'accueil',
    it: '← Torna alla home',
    'pt-PT': '← Voltar ao início',
    'pt-BR': '← Voltar ao início'
  };
  const titles = { 
    de: 'Impressum – 1+1=3', 
    en: 'Imprint – 1+1=3', 
    es: 'Aviso Legal – 1+1=3',
    fr: 'Mentions Légales – 1+1=3',
    it: 'Note Legali – 1+1=3',
    'pt-PT': 'Aviso Legal – 1+1=3',
    'pt-BR': 'Aviso Legal – 1+1=3'
  };

  const backLink = document.getElementById('back-link');
  if(backLink) {
    backLink.textContent = backTexts[lang];
    backLink.href = 'index.html?lang=' + lang;
  }
  
  document.title = titles[lang];

  ['de','en','es','fr','it','pt-PT','pt-BR'].forEach(l => {
    const btn = document.getElementById('btn-' + l);
    if(btn) btn.classList.toggle('active', l === lang);
  });
}

const urlParams = new URLSearchParams(window.location.search);
const urlLang = urlParams.get('lang');
const savedLang = urlLang || localStorage.getItem('lang') || 'de';

window.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => setLang(savedLang), 50);
});
</script>

</body>
</html>
