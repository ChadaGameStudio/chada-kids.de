<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Impressum – 1+1=3</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #e8527a;
      --blue: #4fc3f7;
      --bg: #1a1f2e;
      --bg-nav: rgba(16, 20, 32, 0.97);
      --text: #ffffff;
      --text-muted: rgba(255,255,255,0.65);
      --text-faint: rgba(255,255,255,0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 2rem;
      background: var(--bg-nav);
      border-bottom: 0.5px solid rgba(255,255,255,0.07);
    }

    .nav-logo a { color: #fff; text-decoration: none; }

    .lang-switcher { display: flex; gap: 0.4rem; }
    .lang-btn {
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: transparent;
      color: rgba(255,255,255,0.4);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .lang-btn.active {
      background: rgba(232,82,122,0.18);
      border-color: rgba(232,82,122,0.5);
      color: #fff;
    }

    main {
      max-width: 760px;
      margin: 0 auto;
      padding: 3rem 2rem 5rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 2rem;
      letter-spacing: -0.5px;
    }

    h2 {
      font-size: 0.88rem;
      font-weight: 700;
      margin-top: 2.5rem;
      margin-bottom: 1rem;
      color: var(--pink);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
    }

    .section {
      padding-bottom: 1.5rem;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 1rem;
    }
    .section:last-of-type { border-bottom: none; }

    a { color: var(--pink); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.9rem;
    }
    .back-link:hover { color: var(--pink); }

    .source {
      margin-top: 2rem;
      color: rgba(255,255,255,0.3);
      font-size: 0.85rem;
    }

    footer {
      border-top: 0.5px solid rgba(255,255,255,0.08);
      padding: 2rem;
      text-align: center;
      color: rgba(255,255,255,0.3);
      font-size: 0.8rem;
    }

    @media (max-width: 480px) {
      nav { padding: 1rem 1.25rem; }
      main { padding: 2rem 1.25rem 4rem; }
      h1 { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<nav>
  <div class="nav-logo">
    <a href="index.html"><img src="logo%20(2).png" alt="1+1=3" style="height: 36px; width: auto;" /></a>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" id="btn-de" onclick="setLang('de')">DE</button>
    <button class="lang-btn" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="lang-btn" id="btn-es" onclick="setLang('es')">ES</button>
    <button class="lang-btn" id="btn-pt-BR" onclick="setLang('pt-BR')">BR</button>
  </div>
</nav>

<main>
  <a href="index.html" class="back-link" id="back-link">← Zurück zur Startseite</a>
  <div id="content"></div>
</main>

<footer>
  Chada Kids &middot; chada-kids.de
</footer>

<script>
const SUPPORTED_LANGS = ['de', 'en', 'es', 'pt-BR'];

const BACK_TEXTS = {
  'de': '← Zurück zur Startseite',
  'en': '← Back to homepage',
  'es': '← Volver al inicio',
  'pt-BR': '← Voltar ao início'
};

const TITLES = {
  'de': 'Impressum – 1+1=3',
  'en': 'Imprint – 1+1=3',
  'es': 'Aviso legal – 1+1=3',
  'pt-BR': 'Aviso legal – 1+1=3'
};

async function setLang(lang) {
  if (!SUPPORTED_LANGS.includes(lang)) lang = 'de';

  localStorage.setItem('lang', lang);
  document.documentElement.lang = lang;
  document.title = TITLES[lang];
  document.getElementById('back-link').textContent = BACK_TEXTS[lang];

  SUPPORTED_LANGS.forEach(function(l) {
    document.getElementById('btn-' + l).classList.toggle('active', l === lang);
  });

  try {
    const response = await fetch('imprint-' + lang + '.html');
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const html = await response.text();
    document.getElementById('content').innerHTML = html;
  } catch (e) {
    console.error('Could not load imprint content for', lang, e);
    document.getElementById('content').innerHTML = '<p>Inhalt konnte nicht geladen werden. / Content could not be loaded.</p>';
  }
}

// URL-Parameter hat Vorrang, dann localStorage
const urlParams = new URLSearchParams(window.location.search);
const urlLang = urlParams.get('lang');
const savedLang = urlLang || localStorage.getItem('lang') || 'de';
setLang(savedLang);
</script>

</body>
</html>
